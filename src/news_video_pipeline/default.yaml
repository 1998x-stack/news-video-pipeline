project:
  language: zh-CN
  title_prefix: 政策新闻解读
planner:
  provider: heuristic   # heuristic | openai-compatible
  max_chars_per_scene: 125
  max_scenes: 16
  model: ''
  base_url: ''   # defaults to OPENAI_BASE_URL
  temperature: 0
  # openai-compatible only. Thinking gateways often share max_tokens between the
  # hidden reasoning trace and the answer, and can take minutes per manuscript.
  timeout_s: 240          # per-read timeout; requests are streamed so long calls survive
  max_total_s: 900        # hard wall-clock ceiling for one planning call
  max_tokens: 8192        # reasoning + answer budget
  max_retries: 1
  reasoning_effort: ''    # e.g. 'none' to suppress runaway reasoning (empty = omit field)
  min_source_coverage: 0.75  # grounding guard: matched source characters / narration characters
  chunk_chars: 0           # opt in to longform: split source verbatim into LLM calls
  max_chunks: 16           # cap API call count, fail instead of unexpected spend
  chunk_min_retention: 0.6 # source-to-output lexical retention plus all numeric tokens
voice:
  provider: espeak       # espeak | edge | synthetic (TEST ONLY)
  name: zh
  rate: 155
  pause_ms: 260
  sample_rate: 24000
  edge_rate: '+0%'
render:
  width: 1280
  height: 720
  fps: 25
  preset: veryfast       # x264 preset; use ultrafast for explicitly lower-quality previews
  crf: 22                # higher = smaller/faster but lower visual fidelity
  timeout_s: 1200        # FFmpeg wall time; raise for longer news programs
  font_path: ''
  embed_subtitles: false
quality:
  max_duration_diff_ms: 160
  whisper_check: false
  whisper_model: small
  whisper_device: cpu
  min_transcript_similarity: 0.60
editorial:
  mode: none              # none (whole manuscript) | curated-analysis (AI news chief editor)
  top_k: 5                # target number of selected stories (3-5 by product intent)
  min_candidates: 3       # below this the run reports insufficiency instead of padding
  shortlist: 9            # candidates taken into the second, comparative ranking pass
  min_total_score: 55     # weighted score (0-100) required to be selectable
  min_confidence: 0.5     # planner confidence required to be selectable
  max_topic_share: 0.6    # soft diversity ceiling for one topic among the selection
  batch_size: 8           # candidates per scoring call (bounds cost and latency)
  fact_anchor_min: 0.6    # normalised overlap a FACT claim needs with its cited span
  max_revisions: 2        # bounded critic-driven script revisions
  target_duration_ms: [360000, 600000]   # 6-10 minutes (600000 ms, not 900000); enforced by budgeting, never truncation
  # Measured, not guessed: espeak-ng voice zh at voice.rate 155 produced 3157
  # narration characters in 961.6 s (= 3.28 chars/s) on the local run recorded in
  # docs/verification/editorial-selection-e2e.md. Re-measure for another TTS voice;
  # this number converts target_duration_ms into a spoken-character budget.
  speech_chars_per_second: 3.28
  length_tolerance: 1.0   # compatibility setting; hard max always equals target maximum, not 115%
  aggregate_headings:     # programme sections that glue several stories into one block
    - 国内联播快讯
    - 国际联播快讯
  weights:                # configurable initial hypothesis, not user-validated
    public_impact: 25
    structural_importance: 20
    information_novelty: 15
    analytical_depth: 15
    timeliness: 10
    evidence_quality: 10
    audience_utility: 5
  critique_min:
    factual_grounding: 7
    analytical_depth: 6
    original_insight: 5
    clarity: 7
    audience_utility: 6
    uncertainty_handling: 7
    narrative_coherence: 7
