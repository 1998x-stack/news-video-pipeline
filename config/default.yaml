project:
  language: zh-CN
  title_prefix: 政策新闻解读
planner:
  provider: heuristic   # heuristic | openai-compatible
  max_chars_per_scene: 125
  max_scenes: 16
  model: ''
  base_url: ''   # defaults to OPENAI_BASE_URL
  temperature: 0
  timeout_s: 240          # per-read timeout; requests are streamed
  max_total_s: 900        # hard wall-clock ceiling for one planning call
  max_tokens: 8192        # thinking gateways share this between reasoning and answer
  max_retries: 1
  reasoning_effort: ''    # e.g. 'none' to suppress runaway reasoning (empty = omit field)
  min_source_coverage: 0.75  # grounding guard
voice:
  provider: espeak       # espeak | edge | synthetic (TEST ONLY)
  name: zh
  rate: 155
  pause_ms: 260
  sample_rate: 24000
  edge_rate: '+0%'
render:
  width: 1280
  height: 720
  fps: 25
  font_path: ''
  embed_subtitles: false
quality:
  max_duration_diff_ms: 160
  whisper_check: false
  whisper_model: small
  whisper_device: cpu
  min_transcript_similarity: 0.60
